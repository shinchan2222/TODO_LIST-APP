name: RoutineCraft Android Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Copy Web Assets & Sync Capacitor
        run: |
          mkdir -p www/src/plugins
          cp index.html app.js style.css sw.js version.json package.json manifest.json capacitor.config.json www/
          cp -r src/* www/src/
          npx cap sync android

      - name: Set Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/RoutineCraft_v19.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/RoutineCraft.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutineCraft-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.1-build19
          name: RoutineCraft v1.8.1 (Build 19)
          body: |
            ## 🚀 RoutineCraft v1.8.1 (Build 19) Release
            
            ### ✨ What's New:
            - **Exact Background Push Notifications**: `AlarmManager.RTC_WAKEUP` exact Doze mode wakeups for daily habits.
            - **1-Tap Google Sign-In**: Instant cloud registration in Firebase Authentication & Realtime Database.
            - **Real-Time Network Status**: Live 🟢 Green / 🔴 Red online-offline indicator with auto-sync.
            - **Offline Cloud Sync Queue**: Seamless queueing and automatic cloud flush on reconnect.
            - **Data Export & Migration Center**: One-tap export to CSV (Excel), Notion/Markdown, and JSON backup & restore.
            
            ### 📥 Download:
            Download `RoutineCraft_v19.apk` below and install directly on your Android phone.
          files: |
            build_output/RoutineCraft_v19.apk
            build_output/RoutineCraft.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
