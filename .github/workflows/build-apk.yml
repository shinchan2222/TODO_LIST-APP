name: RoutineCraft Android Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Copy Web Assets & Sync Capacitor
        run: |
          mkdir -p www/src/plugins
          cp index.html app.js style.css sw.js version.json package.json manifest.json capacitor.config.json www/
          cp -r src/* www/src/
          npx cap sync android

      - name: Set Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build_output/RoutineCraft_v2.3.0.apk
          cp "$APK_PATH" build_output/RoutineCraft.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutineCraft-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.0
          name: RoutineCraft v2.3.0 (Build 24)
          body: |
            ## 🚀 RoutineCraft v2.3.0 (Build 24) — Touch & Desktop Task Dragging, Templates, Onboarding & Enhancements

            ### ✅ What's New & Fixed:
            - **Touch & Desktop Drag-and-Drop Task Reordering** — dedicated grip handle with tactile haptic feedback, auto-scrolling near edges, drop indicator guidelines, and custom order persistence.
            - **Task Templates** — 1-tap pre-built routines (Morning Routine, Work Day, Evening Routine) in Settings.
            - **Weekly Recurrence** — scheduled tasks recur on the exact same weekday.
            - **Onboarding Experience** — interactive intro guide for new users.
            - **Play Store Deployment Automation** — automated AAB build and publishing pipeline.

            ### 📲 Download:
            Download `RoutineCraft_v2.3.0.apk` or `RoutineCraft.apk` below and install directly on your Android phone.
          files: |
            build_output/RoutineCraft_v2.3.0.apk
            build_output/RoutineCraft.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
