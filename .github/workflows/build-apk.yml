name: RoutineCraft Android Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Copy Web Assets & Sync Capacitor
        run: |
          mkdir -p www/src/plugins
          cp index.html app.js style.css sw.js version.json package.json manifest.json capacitor.config.json www/
          cp -r src/* www/src/
          npx cap sync android

      - name: Set Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/RoutineCraft_v2.2.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build_output/RoutineCraft.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutineCraft-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.0
          name: RoutineCraft v2.2.0 (Build 22)
          body: |
            ## 🚀 RoutineCraft v2.2.0 (Build 22) Feature Release
            
            ### ✨ What's New:
            - **Minimalist Focus / Pomodoro Mode**: Built-in 25-minute focus session timer with animated circular progress ring, audio chime, and session completion celebration.
            - **Mobile Swipe Gestures**: Swipe right to complete tasks instantly; swipe left to reveal quick reschedule and delete actions.
            - **Drag-and-Drop Task Reordering**: Intuitive drag handle to sequence today's tasks in your preferred order.
            - **Custom Category Tags**: Create and manage custom categories in Settings with custom icon and color pickers.
            - **Daily Morning Digest Notification**: Automated daily briefing reminder summarizing your scheduled tasks for the day.
            - **Seamless Native Full-Page Navigation**: Pure slate light and dark modes with persistent checklist states.
            
            ### 📲 Download:
            Download `RoutineCraft_v2.2.0.apk` below and install directly on your Android phone.
          files: |
            build_output/RoutineCraft_v2.2.0.apk
            build_output/RoutineCraft.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
