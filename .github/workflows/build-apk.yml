name: RoutineCraft Android Build & Release CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Copy Web Assets & Sync Capacitor
        run: |
          mkdir -p www/src/plugins
          cp index.html app.js style.css sw.js version.json package.json manifest.json capacitor.config.json www/
          cp -r src/* www/src/
          npx cap sync android

      - name: Set Execute Permissions for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: ./android
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output
          APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          TAG_NAME="${GITHUB_REF_NAME:-v2.4.0}"
          if [[ "$TAG_NAME" == "main" ]]; then TAG_NAME="v2.4.0"; fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          cp "$APK_PATH" "build_output/RoutineCraft_${TAG_NAME}.apk"
          cp "$APK_PATH" build_output/RoutineCraft.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoutineCraft-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: RoutineCraft ${{ env.TAG_NAME }} (Build 25)
          body: |
            ## 🔔 RoutineCraft ${{ env.TAG_NAME }} (Build 25) — Native Android Scheduled Alarms & Notifications

            ### ✅ What's New:
            - **Native Android Scheduled Alarms Engine** — exact alarms ring with sound & vibration at task due times, even when screen is locked or app is closed (`@capacitor/local-notifications`, `SCHEDULE_EXACT_ALARM`, `WAKE_LOCK`, `RECEIVE_BOOT_COMPLETED`).
            - **High-Importance Notification Channel** (`routinecraft_alarms`) with heads-up alerts and vibration.
            - **Morning Task Briefing** — scheduled daily notification summarizing your day's tasks with customizable briefing time.
            - **Test Alarm (5s)** — 1-tap quick in-app test alarm to verify sound, vibration, and lock-screen alerting.
            - **Permission Status & Management** — real-time permissions indicator and request action.
            - **Interactive Task History Calendar** in Stats page with day-by-day inspector.

            ### 📲 Download:
            Download `RoutineCraft_${{ env.TAG_NAME }}.apk` or `RoutineCraft.apk` below and install directly on your Android phone.
          files: |
            build_output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
